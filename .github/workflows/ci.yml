name: ProofReader checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,webtest]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_demo.py && python scripts/build_typed_demo.py && python scripts/build_narrative_demo.py
      - name: Test source reader, browser, corpus accounting and security
        env:
          PROOFREADER_REQUIRE_BROWSER: '1'
        run: python -m pytest -q --ignore=tests/test_lean_integration.py --ignore=tests/test_kernel_integration.py --ignore=tests/test_narrative_integration.py --ignore=tests/test_narrative_batch_integration.py --junitxml=artifacts/ci-python.xml
      - name: Assert packaged source assets have no drift
        run: git diff --exit-code -- proofreader/data artifacts/openai-sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: artifacts/ci-python.xml
  lean-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          build-args: 'ProofReader ProofReader.Smoke KernelExport Narrative NarrativeBatch'
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Require actual export, exact replay and tamper rejection
        env:
          PROOFREADER_REQUIRE_LEAN: '1'
          LEANGLISH_BATCH_ARTIFACTS: artifacts/ci-narrative-batch
        run: python -m pytest tests/test_lean_integration.py tests/test_kernel_integration.py tests/test_narrative_integration.py tests/test_narrative_batch_integration.py -q --junitxml=artifacts/ci-lean.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-integration-results
          path: |
            artifacts/ci-lean.xml
            artifacts/ci-narrative-batch/
            lean/.lake/build/logs/
