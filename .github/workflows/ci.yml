name: ProofReader checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The dev extra includes PyYAML, so the workflow-structure tests run here.
      - run: python -m pip install '.[dev,webtest]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_demo.py && python scripts/build_typed_demo.py && python scripts/build_narrative_demo.py
      - name: Test source reader, browser, corpus accounting and security
        env:
          PROOFREADER_REQUIRE_BROWSER: '1'
        run: python -m pytest -q --ignore=tests/test_lean_integration.py --ignore=tests/test_kernel_integration.py --ignore=tests/test_narrative_integration.py --ignore=tests/test_narrative_batch_integration.py --ignore=tests/test_narrative_context_integration.py --junitxml=artifacts/ci-python.xml
      - name: Assert the demo build and tests leave every tracked file unchanged
        # The build scripts rewrite files in proofreader/data, artifacts/openai-sample,
        # artifacts/v0.2 and artifacts/v0.3; any of them can drift, so the whole
        # tracked tree is compared, and new files in those directories fail too.
        run: |
          if ! git diff --quiet; then
            git diff --stat
            echo '::error::Tracked files differ after the demo build and tests. Rebuild them with scripts/build_demo.py, scripts/build_typed_demo.py and scripts/build_narrative_demo.py and commit the result.'
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- proofreader/data artifacts/openai-sample artifacts/v0.2 artifacts/v0.3)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked"
            echo '::error::The demo build wrote files that are not committed.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: artifacts/ci-python.xml
  lean-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          build-args: 'ProofReader ProofReader.Smoke KernelExport Narrative NarrativeBatch'
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Require actual export, exact replay and tamper rejection
        env:
          PROOFREADER_REQUIRE_LEAN: '1'
          LEANGLISH_BATCH_ARTIFACTS: artifacts/ci-narrative-batch
        run: python -m pytest tests/test_lean_integration.py tests/test_kernel_integration.py tests/test_narrative_integration.py tests/test_narrative_batch_integration.py tests/test_narrative_context_integration.py -q --junitxml=artifacts/ci-lean.xml
      - name: Check source expressions and lemma extraction
        run: |
          lean_binary="$(cd lean && elan which lean)"
          python scripts/check_source_expressions.py --lean "$lean_binary" --output artifacts/ci-source-expressions-core --trust-project
          git diff --exit-code
      - name: Check agent outline revision transactions
        run: |
          lean_binary="$(cd lean && elan which lean)"
          python scripts/check_agent_outline.py --lean "$lean_binary" --output artifacts/ci-agent-outline --trust-project
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-outline-evidence
          path: artifacts/ci-agent-outline/
          retention-days: 30
          if-no-files-found: error
      - name: Retain the source-expression checking inputs
        if: always()
        run: |
          mkdir -p artifacts/ci-source-expressions-core
          git rev-parse HEAD > artifacts/ci-source-expressions-core/commit.txt
          git rev-parse HEAD^{tree} > artifacts/ci-source-expressions-core/tree.txt
          git archive --format=zip HEAD -o artifacts/ci-source-expressions-core/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-expressions-core
          path: artifacts/ci-source-expressions-core/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-integration-results
          path: |
            artifacts/ci-lean.xml
            artifacts/ci-narrative-batch/
            lean/.lake/build/logs/
