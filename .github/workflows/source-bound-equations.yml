name: Source-bound equations
on:
  workflow_dispatch:
  push:
    branches: ['work/source-bound-equations-20261019']
  pull_request:
    paths:
      - 'lean/EquationEnglish*.lean'
      - 'lean/WitnessEnglish*.lean'
      - 'lean/SourceEquations.lean'
      - 'lean/SourceWitnesses.lean'
      - 'lean/ArithmeticEnglish.lean'
      - 'lean/SourceCancellation.lean'
      - 'scripts/check_source_equations.py'
      - 'scripts/check_source_cancellation.py'
      - 'proofreader/equation_text.py'
      - 'docs/companion/**'
      - 'docs/SOURCE_BOUND_EQUATIONS.md'
      - 'artifacts/source-equations/**'
      - 'tests/test_source_equations.py'
      - 'tests/reader/test_bezout_companion.py'
      - '.github/workflows/source-bound-equations.yml'
permissions:
  contents: read
jobs:
  equations-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: d13f23b723b8a846827a245b89c10fc7d3f11612
          path: equation-mathlib
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: equation-mathlib
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Retrieve the pinned imports and dependencies
        working-directory: equation-mathlib
        run: lake exe cache get Mathlib/Algebra/EuclideanDomain/Basic.lean Mathlib/Tactic/Ring.lean
      - name: Check source equations, witnesses, literal text, and negative controls
        run: |
          lean_binary="$(cd equation-mathlib && elan which lean)"
          test -x "$lean_binary"
          python scripts/check_source_equations.py --lean "$lean_binary" --project equation-mathlib --output artifacts/ci-source-equations --trust-project
      - name: Compare the native records with the frozen reader input
        run: |
          cmp artifacts/source-equations/equations-positive.json artifacts/ci-source-equations/equations-positive.json
          cmp artifacts/source-equations/witnesses-positive.json artifacts/ci-source-equations/witnesses-positive.json
          for kind in equations witnesses; do
            for file in artifacts/source-equations/${kind}-[0-9]*.txt; do
              cmp "$file" "artifacts/ci-source-equations/$(basename "$file")"
            done
          done
          git rev-parse HEAD > artifacts/ci-source-equations/application-commit.txt
      - name: Check reader evidence handling and unchanged generated output
        run: |
          python -m pytest tests/test_source_equations.py tests/test_source_text.py tests/test_source_cancellation_gate.py tests/test_editorial_style.py -q --junitxml=artifacts/ci-source-equations/python-tests.xml
          python docs/companion/build.py
          git diff --exit-code
      - name: Retain the checked source
        if: always()
        run: |
          mkdir -p equation-source
          git rev-parse HEAD > equation-source/commit.txt
          git archive --format=zip HEAD -o equation-source/source.zip
          sha256sum equation-source/source.zip > equation-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-equation-evidence
          path: artifacts/ci-source-equations/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equation-source
          path: equation-source/
          retention-days: 30
          if-no-files-found: error
