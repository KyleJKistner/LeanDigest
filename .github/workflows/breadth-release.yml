name: Rebuild the 0.4.1 catalog inputs

# Re-assembles the frozen inputs of release leanglish-all-findings-v0.4.1 with
# the application at the dispatched commit, then runs the real offline browser
# audit. The renderer has changed since that release, so the output is a
# rebuild, not the release: release.json records release_version
# 'rebuild-of-0.4.1' and the printer versions of the readings it wrote, and the
# artifact is named as a rebuild. Dispatch only, so no push rebuilds it. The
# release exists and is immutable; this workflow never publishes a release,
# pushes or saves a cache. Its inputs are artifacts that expire
# (docs/INPUT_PRESERVATION.md); a missing or expired one fails the first check.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: breadth-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require every pinned input to be listed and unexpired
        # Reads the run IDs and artifact names from the download step below, so a
        # repin (scripts/preserve_inputs.py repin) edits only that step.
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: .github/workflows/breadth-release.yml
        run: |
          python - <<'PY'
          import fnmatch, json, os, re, subprocess, sys
          text = open(os.environ['WORKFLOW_FILE']).read()
          pins = re.findall(r"gh run download ([0-9]+) (?:-n (\S+)|-p '([^']+)')", text)
          if not pins:
              sys.exit('No pinned download was found in ' + os.environ['WORKFLOW_FILE'])
          problems = []
          for run, name, pattern in pins:
              wanted = name or pattern
              try:
                  listing = json.loads(subprocess.check_output(['gh', 'api',
                      'repos/%s/actions/runs/%s/artifacts?per_page=100' % (os.environ['GITHUB_REPOSITORY'], run)]))
              except subprocess.CalledProcessError as exc:
                  problems.append('run %s (%s): the artifact listing failed (exit %d)' % (run, wanted, exc.returncode))
                  continue
              if listing['total_count'] > 100:
                  problems.append('run %s: %d artifacts; this check reads only the first 100' % (run, listing['total_count']))
              found = [a for a in listing['artifacts'] if fnmatch.fnmatchcase(a['name'], wanted)]
              expired = [a['name'] for a in found if a['expired']]
              if not found or expired:
                  problems.append('run %s (%s): %d listed, expired: %s' % (run, wanted, len(found), ', '.join(expired) or 'none'))
              else:
                  print('run %s (%s): %d listed, none expired' % (run, wanted, len(found)))
          if problems:
              for p in problems:
                  print('::error::Pinned input unavailable: ' + p)
              sys.exit('See docs/INPUT_PRESERVATION.md for preserved copies and the repin steps.')
          PY
      - run: python -m pip install '.[dev,webtest]'
      - run: python -m playwright install --with-deps chromium
      - name: Read the frozen source and native observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/catalog-inputs
          gh run download 38822475057 -n complete-openai-lean-source -D /tmp/catalog-inputs/source
          gh run download 39049596449 -n leanglish-all-finding-observations -D /tmp/catalog-inputs/observations
          gh run download 39050823104 -p 'finding-statement-retry-*' -D /tmp/catalog-inputs/statement-retries
          gh run download 39065371645 -p 'finding-proof-retry-*' -D /tmp/catalog-inputs/proof-retries
          gh run download 39076207515 -n leanglish-breadth-observations -D /tmp/catalog-inputs/breadth
      - name: Test inventory, provenance, hostile inputs and unchanged legacy interfaces
        run: python -m pytest tests/test_finding_catalog.py tests/test_breadth.py tests/test_narrative_logic.py tests/test_branding.py -q
      - name: Assemble all documented findings from original files
        run: python scripts/assemble_finding_release.py --inputs /tmp/catalog-inputs --breadth-inputs /tmp/catalog-inputs/breadth --output /tmp/catalog-delivery
      - name: Test actual offline file navigation, mathematical notation and source access
        run: |
          python scripts/audit_finding_browser.py /tmp/catalog-delivery/site \
            --screenshots /tmp/catalog-delivery/screenshots > /tmp/catalog-delivery/browser-audit.json
      - name: Package only after real browser checks pass
        run: |
          python scripts/assemble_finding_release.py --output /tmp/catalog-delivery --package
          mkdir -p /tmp/catalog-delivery/application
          git archive --format=zip --prefix=Leanglish/ -o /tmp/catalog-delivery/application/leanglish-application.zip HEAD
          git rev-parse HEAD > /tmp/catalog-delivery/application/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leanglish-breadth-rebuild
          path: |
            /tmp/catalog-delivery/dist/
            /tmp/catalog-delivery/screenshots/
            /tmp/catalog-delivery/browser-audit.json
            /tmp/catalog-delivery/application/
          retention-days: 30
          if-no-files-found: error
