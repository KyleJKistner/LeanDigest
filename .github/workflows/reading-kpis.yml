name: Reading quality (whole retained corpus)

# Re-renders all 492 retained snapshots with the committed renderer and fails
# if the committed measurement in benchmarks/reading-kpis/current.json is stale
# or any snapshot fails to render. Every renderer change therefore shows its
# corpus-wide effect in the diff. These are displayed-reading measurements, not
# English-fidelity or human-comprehension results.
on:
  push:
    paths: ['proofreader/**', 'benchmarks/reading-kpis/**', 'scripts/fetch_reading_corpus.py', '.github/workflows/reading-kpis.yml']
  pull_request:
    paths: ['proofreader/**', 'benchmarks/reading-kpis/**', 'scripts/fetch_reading_corpus.py', '.github/workflows/reading-kpis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install .
      - name: Fetch the pinned snapshot corpus (digest-checked)
        run: python scripts/fetch_reading_corpus.py "$RUNNER_TEMP/corpus"
      - name: Measure and compare with the committed summary
        run: |
          leanglish reading-kpis "$RUNNER_TEMP/corpus" -o "$RUNNER_TEMP/measured.json" \
            --per-reading "$RUNNER_TEMP/rows.json" --baseline benchmarks/reading-kpis/current.json
          python - "$RUNNER_TEMP/measured.json" <<'PY'
          import json, sys
          measured = json.load(open(sys.argv[1]))
          committed = json.load(open('benchmarks/reading-kpis/current.json'))
          if measured['rendering_failures']:
              sys.exit('Rendering failures: %s' % measured['rendering_failures'][:5])
          if measured != committed:
              sys.exit('benchmarks/reading-kpis/current.json is stale: run `leanglish reading-kpis CORPUS -o benchmarks/reading-kpis/current.json` and commit the result')
          print('Committed reading measurements match the renderer.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-kpis
          path: |
            ${{ runner.temp }}/measured.json
            ${{ runner.temp }}/rows.json
