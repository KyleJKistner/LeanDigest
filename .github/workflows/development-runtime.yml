name: Pinned offline development runtime
on:
  workflow_dispatch:
  push:
    branches: [work/full-original-project]
    paths: ['.github/workflows/development-runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: leanprover/lean-action@v1
        with: {lake-package-directory: lean, auto-config: false, build: false, test: false, lint: false, use-mathlib-cache: false, use-github-cache: false}
      - name: Archive compiler runtime without fonts, credentials or generated project proofs
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/development-runtime
          prefix=$(lean --print-prefix)
          lean --version > /tmp/development-runtime/lean-version.txt
          lake --version > /tmp/development-runtime/lake-version.txt
          tar -czf /tmp/development-runtime/lean4341-runtime.tar.gz --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' --exclude='*.a' --exclude='*.o' --exclude='*.c' --exclude='*.bc' -C "$prefix" bin lib include
          sha256sum /tmp/development-runtime/lean4341-runtime.tar.gz > /tmp/development-runtime/SHA256SUMS
          git -C .. rev-parse HEAD > /tmp/development-runtime/application-commit.txt
          git -C .. archive --format=zip --prefix=Leanglish/ -o /tmp/development-runtime/application.zip HEAD
      - uses: actions/upload-artifact@v4
        with: {name: lean4341-development-runtime, path: /tmp/development-runtime/, retention-days: 90, if-no-files-found: error, compression-level: 0}
