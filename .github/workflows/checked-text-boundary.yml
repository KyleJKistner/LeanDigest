name: Checked text boundary
on:
  workflow_dispatch:
  push:
    branches: ['work/checked-text-boundary-20261019']
  pull_request:
    paths:
      - 'lean/ControlledEnglish*.lean'
      - 'docs/CHECKED_TEXT_BOUNDARY.md'
      - '.github/workflows/checked-text-boundary.yml'
permissions:
  contents: read
jobs:
  checked-text:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retain exact source for reproducible local development
        run: |
          mkdir -p boundary-evidence
          git rev-parse HEAD > boundary-evidence/commit.txt
          git archive --format=zip HEAD -o boundary-evidence/source.zip
          sha256sum boundary-evidence/source.zip > boundary-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checked-text-source
          path: boundary-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Install hash-pinned Lean without the release redirect service
        run: |
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Check the existing logical foundation
        working-directory: lean
        run: |
          lean -o ControlledEnglish.olean ControlledEnglish.lean
          LEAN_PATH=. lean ControlledEnglishAudit.lean
      - name: Retain pinned compiler for isolated development
        run: |
          prefix="$(lean --print-prefix)"
          mkdir -p boundary-toolchain
          lean --version > boundary-toolchain/version.txt
          tar -czf boundary-toolchain/lean-runtime.tar.gz --exclude='*.a' --exclude='*.ilean' --exclude='*.o' --exclude='*.c' -C "$prefix" bin/lean bin/lake lib/lean src/lean
          sha256sum boundary-toolchain/lean-runtime.tar.gz > boundary-toolchain/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: checked-text-toolchain
          path: boundary-toolchain/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
