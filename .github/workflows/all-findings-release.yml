name: All documented finding catalog
on:
  workflow_dispatch:
  push:
    branches: [work/all-findings-delivery, main]
    paths:
      - '.github/workflows/all-findings-release.yml'
      - 'proofreader/finding_catalog.py'
      - 'proofreader/catalog_inputs.py'
      - 'proofreader/catalog_audit.py'
      - 'proofreader/catalog_web/**'
      - 'scripts/assemble_finding_release.py'
      - 'scripts/audit_finding_browser.py'
      - 'tests/test_finding_catalog.py'
      - 'docs/ALL_FINDINGS.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: all-findings-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install '.[dev,webtest]'
      - run: python -m playwright install --with-deps chromium
      - name: Read the frozen source and native observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/catalog-inputs
          gh run download 38822475057 -n complete-openai-lean-source -D /tmp/catalog-inputs/source
          gh run download 39049596449 -n leanglish-all-finding-observations -D /tmp/catalog-inputs/observations
          gh run download 39050823104 -p 'finding-statement-retry-*' -D /tmp/catalog-inputs/statement-retries
          gh run download 39065371645 -p 'finding-proof-retry-*' -D /tmp/catalog-inputs/proof-retries
      - name: Test inventory, provenance, hostile inputs and unchanged legacy interfaces
        run: python -m pytest tests/test_finding_catalog.py tests/test_branding.py -q
      - name: Assemble all documented findings from original files
        run: python scripts/assemble_finding_release.py --inputs /tmp/catalog-inputs --output /tmp/catalog-delivery
      - name: Test actual offline file navigation, mathematical notation and source access
        run: |
          python scripts/audit_finding_browser.py /tmp/catalog-delivery/site \
            --screenshots /tmp/catalog-delivery/screenshots > /tmp/catalog-delivery/browser-audit.json
      - name: Package only after real browser checks pass
        run: |
          python scripts/assemble_finding_release.py --output /tmp/catalog-delivery --package
          mkdir -p /tmp/catalog-delivery/application
          git archive --format=zip --prefix=Leanglish/ -o /tmp/catalog-delivery/application/leanglish-application.zip HEAD
          git rev-parse HEAD > /tmp/catalog-delivery/application/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leanglish-all-findings-delivery
          path: |
            /tmp/catalog-delivery/dist/
            /tmp/catalog-delivery/screenshots/
            /tmp/catalog-delivery/browser-audit.json
            /tmp/catalog-delivery/application/
          retention-days: 90
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'KyleJKistner/LeanDigest'
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: leanglish-all-findings-delivery
          path: /tmp/delivery
      - name: Publish immutable all-findings research preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=leanglish-all-findings-v0.4.0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This frozen release already exists; no asset is overwritten.'
            exit 0
          fi
          gh release create "$tag" /tmp/delivery/dist/leanglish-all-findings.zip \
            /tmp/delivery/dist/coverage.json /tmp/delivery/dist/release.json \
            /tmp/delivery/dist/SHA256SUMS /tmp/delivery/application/leanglish-application.zip \
            --target "$GITHUB_SHA" --title 'Leanglish: all documented OpenAI findings' \
            --notes-file docs/ALL_FINDINGS.md --prerelease
