name: Catalog preview (published readings re-rendered)

# Downloads the pinned published offline catalog, checks its digest, and
# re-renders its 492 proof readings with the committed renderer. No Lean runs;
# snapshots, receipts and run records stay byte-identical. The static audit and
# real Chromium file navigation must pass before the preview zip is uploaded as a
# workflow artifact; a failed run uploads only its diagnostics. The preview also
# adds the supporting lemma readings of the dependency-cone pilot run (a separate
# denominator), downloaded with digests checked against the GitHub API; if they
# cannot be downloaded, the preview is built without them and says why. This
# workflow never publishes a release and never pushes.
on:
  push:
    branches: [claude/keen-archimedes-ihorkq]
    # leanglish/** is hashed into the preview's application identity; pyproject.toml sets the install.
    paths: ['proofreader/**', 'leanglish/**', 'pyproject.toml', 'scripts/rerender_catalog.py', 'scripts/assemble_finding_release.py',
            'scripts/collect_original_evidence.py', 'scripts/fetch_reading_corpus.py', 'scripts/audit_finding_browser.py',
            'scripts/audit_original_browser.py', 'scripts/download_cone_artifacts.py', 'tests/test_rerender_catalog.py',
            'tests/test_cone_catalog.py', 'benchmarks/reading-kpis/**', 'benchmarks/dependency-cone/**',
            '.github/workflows/catalog-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  # Lists and downloads the artifacts of the dependency-cone run below.
  actions: read
concurrency:
  group: catalog-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  # Pinned in scripts/fetch_reading_corpus.py (CORPUS); tests/test_rerender_catalog.py checks both.
  RELEASE_URL: https://github.com/KyleJKistner/LeanDigest/releases/download/leanglish-original-project-317dc31/leanglish-all-findings.zip
  RELEASE_SHA256: 57f9e481a83ff64b7ae01e9cdf0b4b47919adf1899d28313ab3b7e7cf5be0e2b
  # Dependency-cone pilot run (docs/DEPENDENCY_CONE.md). Its artifacts expire on 2027-01-18.
  CONE_RUN: '39373979494'
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install '.[dev,webtest,catalog]'
      - run: python -m playwright install --with-deps chromium
      - name: Preview builder tests (synthetic fixtures)
        env: {PROOFREADER_REQUIRE_BROWSER: '1'}
        run: python -m pytest -q tests/test_rerender_catalog.py tests/test_cone_catalog.py
      - name: Download the pinned published catalog and check its digest
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/release.zip" "$RELEASE_URL"
          echo "$RELEASE_SHA256  $RUNNER_TEMP/release.zip" | sha256sum -c -
      - name: Download the dependency-cone pilot artifacts and check their digests
        # Never fails the job: without verified artifacts the preview omits the
        # supporting lemma readings and states the reason in its notes.
        id: cone
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if python scripts/download_cone_artifacts.py --repo "$GITHUB_REPOSITORY" --run "$CONE_RUN" \
               --output "$RUNNER_TEMP/cone" 2> "$RUNNER_TEMP/cone-download.txt"; then
            echo "included=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/cone-download.txt"
            reason="$(tail -n 1 "$RUNNER_TEMP/cone-download.txt" | tr -d '\r' | cut -c1-600)"
            echo "::warning::The preview is built without supporting lemma readings. $reason"
            echo "included=false" >> "$GITHUB_OUTPUT"
            echo "reason=The artifacts of dependency-cone run $CONE_RUN were not used. ${reason:-No reason was recorded.}" >> "$GITHUB_OUTPUT"
          fi
      - name: Re-render, audit statically and navigate the files in Chromium
        env: {CONE_INCLUDED: '${{ steps.cone.outputs.included }}', CONE_REASON: '${{ steps.cone.outputs.reason }}'}
        run: |
          if [ "$CONE_INCLUDED" = true ]; then
            cone=(--cone-shards "$RUNNER_TEMP/cone" --cone-summary "$RUNNER_TEMP/cone/cone-summary-level-1/dependency-cone-summary.json")
          else
            cone=(--cone-unavailable "${CONE_REASON:-The artifacts of dependency-cone run $CONE_RUN were not downloaded.}")
          fi
          python scripts/rerender_catalog.py "$RUNNER_TEMP/release.zip" "$RUNNER_TEMP/preview" \
            --archive-sha256 "$RELEASE_SHA256" --browser real "${cone[@]}"
      - name: Check the packaged zip again after extraction
        run: |
          cd "$RUNNER_TEMP/preview" && sha256sum -c SHA256SUMS
          mkdir "$RUNNER_TEMP/unpacked" && unzip -q leanglish-catalog-preview.zip -d "$RUNNER_TEMP/unpacked"
          cd "$GITHUB_WORKSPACE"
          python - "$RUNNER_TEMP/unpacked/Leanglish" <<'PY'
          import sys
          from pathlib import Path
          from scripts.rerender_catalog import verify_manifest
          print(len(verify_manifest(Path(sys.argv[1]))), 'packaged files match SHA256SUMS.json')
          PY
          python -m proofreader.catalog_audit "$RUNNER_TEMP/unpacked/Leanglish" > "$RUNNER_TEMP/preview/packaged-static-audit.json"
      - name: Compare the preview's gap counts with the committed reading measurements
        run: |
          python - "$RUNNER_TEMP/preview/summary.json" <<'PY'
          import json, os, sys
          summary = json.load(open(sys.argv[1]))
          gaps = summary['explanation_gaps']['preview']
          kpis = json.load(open('benchmarks/reading-kpis/current.json'))
          if summary['readings']['re_rendered'] != kpis['readings']:
              sys.exit('The preview re-rendered %d readings; the committed measurements cover %d' % (summary['readings']['re_rendered'], kpis['readings']))
          pairs = {'gap steps': (gaps['explicit_explanation_gaps'], kpis['gap_steps']),
                   'frames inside gaps': (gaps['frames_in_explanation_gaps'], kpis['gap_frames']),
                   'readings without gaps': (gaps['readings_without_gaps'], kpis['readings_without_gaps']),
                   'gap steps by rule': (gaps['gaps_by_rule'], kpis['gap_rules']),
                   'frames inside gaps by rule': (gaps['frames_in_gaps_by_rule'], kpis['gap_frames_by_rule'])}
          differ = {k: v for k, v in pairs.items() if v[0] != v[1]}
          if differ:
              sys.exit('The preview and benchmarks/reading-kpis/current.json differ: %s' % differ)
          print('The preview gap counts equal the committed reading measurements.')
          cone = summary['dependency_cone']
          if cone['included']:
              section = cone['section']
              if section['counts_toward_documented_target_coverage'] is not False:
                  sys.exit('Supporting lemma readings must not count toward the theorem targets')
              line = 'Supporting lemma readings (dependency cone, level 1): %d of %d planned; %s scope.' % (
                  section['readings'], section['planned_lemmas'], section['scope'])
          else:
              line = 'Supporting lemma readings are not included in this preview. ' + cone['reason']
              print('::warning::' + line)
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(line + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: leanglish-catalog-preview
          path: |
            ${{ runner.temp }}/preview/leanglish-catalog-preview.zip
            ${{ runner.temp }}/preview/SHA256SUMS
            ${{ runner.temp }}/preview/summary.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-preview-diagnostics
          path: |
            ${{ runner.temp }}/preview/summary.json
            ${{ runner.temp }}/preview/browser-audit.json
            ${{ runner.temp }}/preview/packaged-static-audit.json
            ${{ runner.temp }}/preview/screenshots/
            ${{ runner.temp }}/preview/*.png
            ${{ runner.temp }}/cone/cone-artifacts.json
            ${{ runner.temp }}/cone-download.txt
          retention-days: 30
          if-no-files-found: warn
