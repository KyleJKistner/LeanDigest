name: Leanglish pinned acceptance
on:
  workflow_dispatch:
  push:
    branches: [work/realization-v0.4]
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tested commit without Git credentials
        run: |
          mkdir -p /tmp/leanglish-delivery
          git archive --format=zip --prefix=Leanglish/ -o /tmp/leanglish-delivery/source.zip HEAD
          git rev-parse HEAD > /tmp/leanglish-delivery/commit.txt
          git rev-parse HEAD^{tree} > /tmp/leanglish-delivery/tree.txt
          sha256sum /tmp/leanglish-delivery/source.zip > /tmp/leanglish-delivery/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: leanglish-source
          path: /tmp/leanglish-delivery/
  pinned-openai-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          build-args: 'Narrative NarrativeBatch'
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Run unchanged selected OpenAI sources with upstream dependency pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m proofreader.openai_acceptance benchmarks/openai-slice.json \
            --work /tmp/leanglish-oai-project --output artifacts/acceptance-v0.4 \
            --allow-download --trust-project
      - name: Record the source identity and all outcome counts
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path('artifacts/acceptance-v0.4');out.mkdir(parents=True,exist_ok=True)
          identity={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'scope':'selected-dependency-slice-not-full-project'}
          (out/'run-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          report=out/'acceptance.json'
          if report.exists():
              r=json.loads(report.read_text());print(json.dumps({'status':r.get('status'),'error':r.get('error'),'summary':r.get('summary')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leanglish-pinned-acceptance
          path: artifacts/acceptance-v0.4/
