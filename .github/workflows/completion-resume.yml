name: Resume interrupted original-project worker
on:
  workflow_dispatch:
  pull_request:
    branches: [work/full-original-project]
    types: [labeled]
permissions: {contents: read, actions: read}
concurrency: {group: original-nuclear-checkpoint-resume-v1, cancel-in-progress: false}
env:
  GLIBC_TUNABLES: glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1
jobs:
  resume:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 8 && github.head_ref == 'work/completion-evidence-retries' && github.event.label.name == 'enhancement')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: leanprover/lean-action@v1
        with: {lake-package-directory: lean, auto-config: false, build: false, test: false, lint: false, use-mathlib-cache: false, use-github-cache: false}
      - name: Require stopped predecessors and the independently restored checkpoint
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/acquired /tmp/inputs/source
          python - <<'PY'
          from pathlib import Path
          from scripts.collect_original_evidence import api
          from proofreader.original_project import write
          repo='KyleJKistner/LeanDigest'
          job=api(repo,'actions/jobs/118274980446')
          assert job['run_id']==39315174445 and job['status']=='completed' and job['conclusion']=='failure'
          assert job['name']=='modules (142c3d0f555a25666bb36dd1) / recover'
          for ident,head in [(39321225048,'b717efc98e0cde96181c493b982814b2cdaa9394'),(39352981910,'4a2a7229c62c9d2b2dc7449c2b25ac329acdf5c0')]:
            prior=api(repo,f'actions/runs/{ident}');assert prior['head_sha']==head and prior['status']=='completed'
          gate=api(repo,'actions/runs/39319564118')
          assert gate['head_sha']=='f6931795f8462193046372e8a6dd49383ec0366c'
          assert gate['status']=='completed' and gate['conclusion']=='success'
          a=api(repo,'actions/artifacts/12217614568')
          assert a['workflow_run']['id']==39315174445
          assert a['workflow_run']['head_sha']=='4f9c1e823dd65023cfa7d8b9afe5e08390b8d2ad'
          assert a['digest']=='sha256:f0cb3658f6edbffc2e62cd8f538ea9a7529a0e4cbe4e27286241030441003523'
          assert a['name']=='checkpoint-142c3d0f555a25666bb36dd1-1' and not a['expired']
          write(Path('/tmp/acquired/checkpoint-acquisition.json'),{'artifact_id':a['id'],'run_id':a['workflow_run']['id'],
            'source_commit':a['workflow_run']['head_sha'],'archive_sha256':a['digest'].removeprefix('sha256:')})
          write(Path('/tmp/acquired/previous-worker.json'),job)
          PY
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12217614568/zip > /tmp/acquired/checkpoint.zip
          echo 'f0cb3658f6edbffc2e62cd8f538ea9a7529a0e4cbe4e27286241030441003523  /tmp/acquired/checkpoint.zip' | sha256sum -c -
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12197582957/zip > /tmp/acquired/plan.zip
          echo '8164869bdd4972b89c7481be210ab559493017cdf9c563e834f65362f36b4d6a  /tmp/acquired/plan.zip' | sha256sum -c -
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12152481984/zip > /tmp/acquired/tools.zip
          echo '869b77fe322f2394edc12aa3bf9780809424e512eccce5f45982ffde619c069a  /tmp/acquired/tools.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          from scripts.collect_original_evidence import unpack
          unpack(Path('/tmp/acquired/checkpoint.zip'),Path('/tmp/acquired/checkpoint'))
          unpack(Path('/tmp/acquired/plan.zip'),Path('/tmp/recovery-plan'))
          unpack(Path('/tmp/acquired/tools.zip'),Path('/tmp/tools'))
          PY
          chmod +x /tmp/tools/bin/*
          gh run download 38822475057 -R "$GITHUB_REPOSITORY" -n complete-openai-lean-source -D /tmp/inputs/source
          python -c "from pathlib import Path;from scripts.assemble_finding_release import unpack_source;unpack_source(Path('/tmp/inputs'),Path('/tmp/original-project'))"
      - uses: actions/upload-artifact@v4
        with:
          name: completion-recovery-plan
          path: |
            /tmp/recovery-plan/plan.json
            /tmp/recovery-plan/environment.json
            /tmp/recovery-plan/recovery.json
            /tmp/recovery-plan/campaign.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/original-project/lean/.lake/packages
          key: original-openai-deps-1581d4cb-4341-full-v1
          fail-on-cache-miss: true
      - name: Restore the exact checked checkpoint without changing source or dependencies
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          python scripts/check_original_checkpoint.py --project /tmp/original-project/lean --seed /tmp/recovery-plan --checkpoint /tmp/acquired/checkpoint --output /tmp/resume-check --trust-project
          python - <<'PY'
          from pathlib import Path
          from proofreader.original_project import read,write
          r=read(Path('/tmp/recovery-plan/recovery.json'));restored=read(Path('/tmp/resume-check/result.json'))
          assert restored['status']=='passed' and restored['proof_verified'] is False
          write(Path('/tmp/worker/identity.json'),{'recovery_plan_sha256':r['recovery_plan_sha256'],
            'worker_id':'142c3d0f555a25666bb36dd1','kind':'module',
            'target':'OAI.Analysis.NuclearUltrapower.Main','native_lean_verified':False})
          write(Path('/tmp/worker/resume.json'),{'parent_checkpoint':restored,
            'previous_worker':read(Path('/tmp/acquired/previous-worker.json')),'proof_acceptance_from_checkpoint':False})
          PY
      - name: Allow an atomic module one full hour while observing CPU and memory
        id: first
        run: |
          (while true; do date -u; ps -C lean,lake -o pid,etimes,pcpu,rss,args || true; free -b; sleep 60; done) > /tmp/worker/build-health-2.log &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true' EXIT
          python scripts/run_completion_worker.py round --kind module --id 142c3d0f555a25666bb36dd1 --seed /tmp/recovery-plan --project /tmp/original-project/lean --state /tmp/resume-check/state --output /tmp/worker --round 2 --seconds 3600 --trust-project
          python scripts/run_completion_worker.py pack --kind module --id 142c3d0f555a25666bb36dd1 --seed /tmp/recovery-plan --project /tmp/original-project/lean --state /tmp/resume-check/state --output /tmp/worker --round 2 --trust-project
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumed-checkpoint-142c3d0f555a25666bb36dd1-2
          path: |
            /tmp/worker/checkpoint-2/
            /tmp/worker/build-health-2.log
            /tmp/worker/round-2/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
      - name: Continue only when the first full-hour build was incomplete
        if: steps.first.outputs.status == 'timeout'
        run: |
          (while true; do date -u; ps -C lean,lake -o pid,etimes,pcpu,rss,args || true; free -b; sleep 60; done) > /tmp/worker/build-health-3.log &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true' EXIT
          python scripts/run_completion_worker.py round --kind module --id 142c3d0f555a25666bb36dd1 --seed /tmp/recovery-plan --project /tmp/original-project/lean --state /tmp/resume-check/state --output /tmp/worker --round 3 --seconds 3600 --trust-project
          python scripts/run_completion_worker.py pack --kind module --id 142c3d0f555a25666bb36dd1 --seed /tmp/recovery-plan --project /tmp/original-project/lean --state /tmp/resume-check/state --output /tmp/worker --round 3 --trust-project
      - uses: actions/upload-artifact@v4
        if: always() && steps.first.outputs.status == 'timeout'
        with:
          name: resumed-checkpoint-142c3d0f555a25666bb36dd1-3
          path: |
            /tmp/worker/checkpoint-3/
            /tmp/worker/build-health-3.log
            /tmp/worker/round-3/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
      - name: Execute the original proof and comparison gates independently
        run: python scripts/run_completion_worker.py verify --kind module --id 142c3d0f555a25666bb36dd1 --seed /tmp/recovery-plan --project /tmp/original-project/lean --state /tmp/resume-check/state --output /tmp/worker --tools /tmp/tools --trust-project
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-result-142c3d0f555a25666bb36dd1
          path: |
            /tmp/worker/identity.json
            /tmp/worker/resume.json
            /tmp/worker/final-status.json
            /tmp/worker/round-*/
            /tmp/worker/build-health-*.log
            /tmp/worker/proofs/
            /tmp/worker/comparisons/
          retention-days: 90
          if-no-files-found: warn
