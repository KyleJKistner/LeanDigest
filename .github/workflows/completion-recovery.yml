name: Recover remaining original OpenAI obligations
on:
  workflow_dispatch:
  pull_request:
    branches: [work/full-original-project]
    types: [opened, reopened]
    paths: ['.github/workflows/completion-recovery.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: original-completion-recovery-v1
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'work/completion-evidence-retries'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      modules: ${{ steps.matrix.outputs.modules }}
      libraries: ${{ steps.matrix.outputs.libraries }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: leanprover/lean-action@v1
        with: {lake-package-directory: lean, auto-config: false, build: false, test: false, lint: false, use-mathlib-cache: false, use-github-cache: false}
      - run: python -m pip install '.[dev]'
      - name: Require native checkpoint and exact-complement regression tests
        env: {PROOFREADER_REQUIRE_LEAN: '1'}
        run: python -m pytest -q tests/test_build_resume.py tests/test_original_attempts.py tests/test_completion_recovery_plan.py
      - name: Restore the independently validated immutable recovery plan
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/12197582957/zip > /tmp/recovery-plan.zip
          echo '8164869bdd4972b89c7481be210ab559493017cdf9c563e834f65362f36b4d6a  /tmp/recovery-plan.zip' | sha256sum -c -
          python -c "from pathlib import Path;from scripts.collect_original_evidence import unpack;unpack(Path('/tmp/recovery-plan.zip'),Path('/tmp/recovery-plan'))"
      - name: Retain all outstanding targets in the worker matrix
        id: matrix
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from proofreader.original_project import read,digest,validate_plan
          from proofreader.proof_campaign import validate_campaign,check_environment
          root=Path('/tmp/recovery-plan');r=read(root/'recovery.json');p=read(root/'plan.json');e=read(root/'environment.json')
          validate_plan(p);check_environment(p,e);validate_campaign(p,e,r['campaign'])
          assert r['recovery_plan_sha256']==digest({k:v for k,v in r.items() if k!='recovery_plan_sha256'})
          assert r['expected_theorem_targets']==536 and r['expected_comparators']==416
          modules={'include':[{'id':j['id']} for j in r['module_jobs']]}
          libraries={'include':[{'id':j['library']} for j in r['library_jobs']]}
          assert 0<len(modules['include'])<=256 and 0<len(libraries['include'])<=25
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write('modules='+json.dumps(modules,separators=(',',':'))+'\n')
            out.write('libraries='+json.dumps(libraries,separators=(',',':'))+'\n')
          print('RECOVERY_DENOMINATORS',read(root/'summary.json'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: completion-recovery-plan
          path: |
            /tmp/recovery-plan/plan.json
            /tmp/recovery-plan/environment.json
            /tmp/recovery-plan/recovery.json
            /tmp/recovery-plan/campaign.json
            /tmp/recovery-plan/attempts.json
            /tmp/recovery-plan/summary.json
          retention-days: 90
          if-no-files-found: error
  modules:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.modules) }}
    uses: ./.github/workflows/completion-worker.yml
    with: {kind: module, id: '${{ matrix.id }}'}
  libraries:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.libraries) }}
    uses: ./.github/workflows/completion-worker.yml
    with: {kind: library, id: '${{ matrix.id }}'}
  inventory:
    if: always()
    needs: [plan, modules, libraries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preserve final job and artifact metadata without declaring proof success
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/run-evidence
          gh api --paginate --slurp repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100 > /tmp/run-evidence/jobs.json
          gh api --paginate --slurp repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100 > /tmp/run-evidence/artifacts.json
          git rev-parse HEAD > /tmp/run-evidence/application-commit.txt
          printf '%s\n' 'Job metadata is not mathematical acceptance. Reconcile retained native worker reports and their source-bound receipts independently.' > /tmp/run-evidence/README.txt
      - uses: actions/upload-artifact@v4
        with: {name: completion-run-inventory, path: /tmp/run-evidence/, retention-days: 90, if-no-files-found: error}
