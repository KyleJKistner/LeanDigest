name: Retain original-project outcomes without restarting workers
on:
  workflow_dispatch:
  push:
    branches: [work/original-project-evidence]
    paths: ['.github/workflows/original-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze retained artifacts and verify their archive hashes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python scripts/collect_original_evidence.py --output /tmp/collected --allow-download
          git rev-parse HEAD > /tmp/collected/collector-commit.txt
          git archive --format=zip --prefix=Leanglish/ -o /tmp/collected/application.zip HEAD
      - name: Recover exact original source and bound baseline readings
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/inputs/source
          gh run download 38822475057 -R "$GITHUB_REPOSITORY" -n complete-openai-lean-source -D /tmp/inputs/source
          gh run download 39049596449 -R "$GITHUB_REPOSITORY" -n leanglish-all-finding-observations -D /tmp/inputs/observations
          gh run download 39065371645 -R "$GITHUB_REPOSITORY" -p 'finding-proof-retry-*' -D /tmp/inputs/repaired
          gh run download 39140071998 -R "$GITHUB_REPOSITORY" -n all-prior-proof-observations -D /tmp/inputs/prior
          python -c "from pathlib import Path; from scripts.assemble_finding_release import unpack_source; unpack_source(Path('/tmp/inputs'),Path('/tmp/original-project'))"
      - name: Reconcile all original build, comparison, and proof targets
        run: |
          python - <<'PY'
          from pathlib import Path
          from proofreader.original_project import read,write,reconcile as build_reconcile
          from proofreader.proof_campaign import reconcile as proof_reconcile
          root=Path('/tmp/collected');seed=root/'original-proofs/original-proof-campaign-plan'
          plan=read(seed/'plan.json');env=read(seed/'environment.json');campaign=read(seed/'campaign.json')
          builds=build_reconcile(plan,[p.parent for p in sorted((root/'original-build').rglob('worker.json'))])
          write(root/'original-build-summary.json',builds)
          baseline=[Path('/tmp/inputs/observations/inputs/proofs'),Path('/tmp/inputs/repaired'),Path('/tmp/inputs/prior/remaining'),Path('/tmp/inputs/prior/budget')]
          proofs,accepted=proof_reconcile(Path('/tmp/original-project/lean'),plan,env,campaign,baseline,[p.parent for p in sorted((root/'original-proofs').rglob('original-proof-worker.json'))])
          write(root/'proof-summary.json',proofs)
          diagnostics=[]
          for p in sorted((root/'original-build').rglob('worker.json')):
              r=read(p)
              for row in r['targets']:
                  detail={'task':row['id'],'status':row['status'],'worker_status':r['status'],'worker_error':r.get('error')}
                  if row.get('log'):
                      log=read(p.parent/row['log']);detail.update(exit_code=log.get('exit_code'),reason=log.get('reason'),stdout_tail=log.get('stdout','')[-6000:],stderr_tail=log.get('stderr','')[-6000:])
                  diagnostics.append(detail)
          write(root/'build-diagnostics.json',diagnostics)
          print('ORIGINAL BUILD', {k:v for k,v in builds.items() if k!='missing_tasks'})
          print('PROOF READINGS', {k:v for k,v in proofs.items() if k not in {'targets','missing_workers'}})
          # Baseline data are retained here so the exact collection can be rebuilt offline.
          import shutil
          for i,p in enumerate(baseline):shutil.copytree(p,root/'baseline'/str(i))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-project-evidence-snapshot
          path: /tmp/collected/
          retention-days: 90
          if-no-files-found: error
