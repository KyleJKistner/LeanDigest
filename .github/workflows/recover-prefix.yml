name: Recover intact upload prefix
on:
  push:
    branches: ['import/recover-v0.3.0']
    paths: ['.github/workflows/recover-prefix.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/recover-v0.3.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, subprocess, tarfile, urllib.request
          shas = '816a7ef104b3af3a270aaa1bb777fae926ff4c61 b7866c106426482b67160b9dee0f76a9230c85c8 cb168686bbff34c01bc0a96905dfdb9dfdbaff14 240f319cd1b5899eac82361c7b9976b815f3fbdb 1ce13562f847a3fb53528c3832c81e2b9b4b5ecc 0d1a5a8537a8d2bbc96bc3cd0b3db726f2331bf8 9bfb2478362500b11fac65861d238ab41602e3c5 0cfe251a77c1ca87a26229b1d6e9996960635701 12326ca287466259d7a6761d4e3e2ac36649558a 578899eed724b10e1b1e4352ff49e9fe3b421de0 b275addd48c22920f4e6da1d1cbbc1c3b365ea1d 099e2eeba876d4924d7671460f7342204d8748ed f01ca52779d978f49c80eece4d98347467227e70 06e9d0799f0702cc6e42cb015d76f71fae307654 df591efc54f45c7cd2cd10fc471b1aba65ca38bb'.split()
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw = b''
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/KyleJKistner/LeanDigest/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as response: item=json.load(response)
              data=base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              wire=''.join(data.decode('ascii').split())
              assert len(wire)==12000
              try: part=decoder.decompress(base64.b64decode(wire,validate=True))
              except lzma.LZMAError:
                  print('DAMAGED_PART',sha)
                  break
              raw+=part
              assert len(raw)<8*1024*1024
              print('INTACT_PART',sha,'RAW_BYTES',len(raw))
          root=pathlib.Path.cwd()
          files=[]
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              while True:
                  try: m=archive.next()
                  except tarfile.ReadError: break
                  if m is None or m.offset_data+m.size>len(raw): break
                  p=pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and not {'..','.git','.snapshot-import'}&set(p.parts)
                  if p.parts[0]=='.github': continue
                  b=archive.extractfile(m).read()
                  assert len(b)==m.size
                  b.decode('utf8')
                  target=root.joinpath(*p.parts)
                  assert root in target.resolve().parents and not target.is_symlink()
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(b)
                  target.chmod(0o755 if m.mode&0o111 else 0o644)
                  sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  files.append({'path':str(p),'sha':sha,'size':len(b)})
          assert len(files)>100,len(files)
          pathlib.Path('.snapshot-import').mkdir(exist_ok=True)
          pathlib.Path('.snapshot-import/recovery.json').write_text(json.dumps({'partial_recovery':True,'files':files},indent=2)+'\n')
          for k,v in [('user.name','github-actions[bot]'),('user.email','41898282+github-actions[bot]@users.noreply.github.com')]: subprocess.run(['git','config',k,v],check=True)
          subprocess.run(['git','add','--force','--',*[f['path'] for f in files],'.snapshot-import/recovery.json'],check=True)
          subprocess.run(['git','commit','-m','Recover intact source and evidence files on import branch'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/import/recover-v0.3.0'],check=True)
          print('RECOVERED_FILES',len(files))
          print('RECOVERY_COMMIT',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
