name: Refresh deterministic reader assets
on:
  push:
    branches: [dev/native-and-corpus]
    paths: [.github/workflows/sync-reader-assets.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'KyleJKistner/LeanDigest' && github.ref == 'refs/heads/dev/native-and-corpus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate only the reader outputs for the reviewed printer
        run: |
          test "$(git hash-object proofreader/english.py)" = 2fdc223d2988b17e6972ec7b2dc07fe7965a6aa4
          python scripts/build_demo.py
          python scripts/build_typed_demo.py
          python scripts/build_narrative_demo.py
          git add -- proofreader/data/kernel-demo.json proofreader/data/reader-demo.json \
            artifacts/v0.2/injective_comp.proof.txt artifacts/v0.2/and_swap.proof.txt \
            artifacts/v0.2/trans.proof.txt artifacts/v0.2/witnessed.proof.txt \
            artifacts/v0.2/alternatives.proof.txt artifacts/v0.2/reader.html \
            artifacts/v0.2/demo-coverage.json artifacts/v0.3/reader-library.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'Regenerate bundled readers with scope-preserving math-en/0.3.1'
          git push origin HEAD:refs/heads/dev/native-and-corpus
          git rev-parse HEAD
