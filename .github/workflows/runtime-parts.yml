name: Bounded development runtime delivery
on:
  workflow_dispatch:
  push:
    branches: [work/full-original-project]
    paths: ['.github/workflows/runtime-parts.yml']
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Recover and checksum the original runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/runtime
          gh run download 39142929511 -R "$GITHUB_REPOSITORY" -n lean4341-development-runtime -D /tmp/runtime
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/runtime/lean4341-runtime.tar.gz')
          expected=Path('/tmp/runtime/SHA256SUMS').read_text().split()[0]
          h=hashlib.sha256(p.read_bytes()).hexdigest();assert h==expected
          result={'sha256':h,'parts':[],'size':p.stat().st_size}
          with p.open('rb') as f:
              for i in range(4):
                  b=f.read(200000000)
                  d=Path('/tmp/runtime-parts')/str(i);d.mkdir(parents=True)
                  (d/'part.bin').write_bytes(b)
                  result['parts'].append({'index':i,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              assert not f.read(1)
          out=Path('/tmp/runtime-parts/meta');out.mkdir()
          (out/'manifest.json').write_text(json.dumps(result,indent=2)+'\n')
          for name in ['lean-version.txt','lake-version.txt','application.zip']:
              (out/name).write_bytes(Path('/tmp/runtime',name).read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with: {name: lean-runtime-part-0, path: /tmp/runtime-parts/0/, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: lean-runtime-part-1, path: /tmp/runtime-parts/1/, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: lean-runtime-part-2, path: /tmp/runtime-parts/2/, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: lean-runtime-part-3, path: /tmp/runtime-parts/3/, compression-level: 0, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: lean-runtime-metadata, path: /tmp/runtime-parts/meta/, retention-days: 90}
