name: Recover two resource-limited proof readings
on:
  workflow_dispatch:
  push:
    branches: [work/breadth-recovery]
    paths: ['.github/workflows/proof-budget-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: proof-budget-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          mkdir -p /tmp/delivery
          git archive --format=zip --prefix=Leanglish/ -o /tmp/delivery/application.zip HEAD
          git rev-parse HEAD > /tmp/delivery/application-commit.txt
          git rev-parse HEAD^{tree} > /tmp/delivery/application-tree.txt
      - uses: actions/upload-artifact@v4
        with: {name: budget-recovery-application, path: /tmp/delivery/, retention-days: 90}
  proofs:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: RotationWeights
            module: OAI.Analysis.RotationWeights.Main
            theorem: OAI.ContinuousCircleWeight.main_theorem
          - label: TreewidthL1
            module: OAI.Combinatorics.TreewidthL1.Main
            theorem: OAI.BoundedTreewidthL1.main_theorem
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Recover source and reconcile the explicit retry queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-artifact /tmp/upstream /tmp/prior-proofs
          gh run download 38822475057 -R "$GITHUB_REPOSITORY" -n complete-openai-lean-source -D /tmp/source-artifact
          gh run download 39076207515 -R "$GITHUB_REPOSITORY" -n leanglish-breadth-observations -D /tmp/prior-proofs
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,tarfile,shutil
          from proofreader.openai_acceptance import lake_config
          root=Path('/tmp/source-artifact'); archive=root/'openai-lean-source.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          summary=json.loads((root/'source-summary.json').read_text())
          assert summary['commit']=='1581d4cbdd69a0faf34b2089614fe2a814316a6a' and summary['all_source_bytes_match_git']
          with tarfile.open(archive) as t: t.extractall('/tmp/upstream',filter='data')
          source=Path('/tmp/upstream/lean'); project=Path('/tmp/finding-proof-project'); project.mkdir()
          manifest=json.loads((source/'lake-manifest.json').read_text())
          shared={'mathlib','batteries','aesop','Qq','Cli','LeanSearchClient','importGraph','plausible','proofwidgets'}
          pins=[{k:p[k] for k in ('name','url','rev')} for p in manifest['packages'] if p['name'] in shared]
          assert len(pins)==9
          for folder in ('ComparatorChallenges','OAI'): shutil.move(str(source/folder),str(project/folder))
          shutil.copy2(source/'lean-toolchain',project/'lean-toolchain')
          (project/'lakefile.toml').write_text(lake_config(pins))
          (project/'selected-pins.json').write_text(json.dumps(pins,indent=2))
          module='${{ matrix.module }}'; theorem='${{ matrix.theorem }}'
          old=[json.loads(p.read_text()) for p in Path('/tmp/prior-proofs/remaining').rglob('proofs.json')]
          prior=[x for r in old for x in r['targets'] if x['module']==module and x['name']==theorem]
          assert len(prior)==1 and prior[0]['status']=='extraction-failed'
          selection=[{'module':module,'name':theorem}]
          Path('/tmp/selection.json').write_text(json.dumps(selection,indent=2))
          PY
      - name: Resolve exact shared dependency revisions
        run: |
          cd /tmp/finding-proof-project
          lake update
          lake exe cache get
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          pins=json.loads(Path('selected-pins.json').read_text())
          actual={x['name']:x for x in json.loads(Path('lake-manifest.json').read_text())['packages']}
          assert set(actual)=={x['name'] for x in pins}
          for x in pins:
              assert actual[x['name']]['rev']==x['rev'] and actual[x['name']]['url']==x['url']
              assert subprocess.check_output(['git','-C',str(Path('.lake/packages')/x['name']),'rev-parse','HEAD'],text=True).strip()==x['rev']
          PY
      - name: Retry unchanged theorem bodies with repaired exporter
        run: |
          python scripts/retry_finding_proofs.py --project /tmp/finding-proof-project \
            --output /tmp/proof-budget-${{ matrix.label }} --selection /tmp/selection.json \
            --shard 0 --shards 1 --wall-seconds 2400 --build-timeout 1500 --extract-timeout 900 --max-heartbeats 2000000 --trust-project
      - name: Preserve all outcomes and source identity
        if: always()
        run: |
          mkdir -p /tmp/proof-budget-${{ matrix.label }}
          git rev-parse HEAD > /tmp/proof-budget-${{ matrix.label }}/application-commit.txt
          cp /tmp/selection.json /tmp/proof-budget-${{ matrix.label }}/ 2>/dev/null || true
          cp /tmp/finding-proof-project/selected-pins.json /tmp/proof-budget-${{ matrix.label }}/ 2>/dev/null || true
          cp /tmp/finding-proof-project/lake-manifest.json /tmp/proof-budget-${{ matrix.label }}/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finding-proof-budget-${{ matrix.label }}
          path: /tmp/proof-budget-${{ matrix.label }}/
          retention-days: 90
