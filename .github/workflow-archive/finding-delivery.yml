name: Finding catalog delivery
on:
  push:
    branches: [work/finding-catalog]
    paths:
      - '.github/workflows/finding-delivery.yml'
      - 'proofreader/finding_catalog.py'
      - 'proofreader/catalog_web/**'
      - 'tests/test_finding_catalog*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable finding observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/finding-delivery/inputs
          gh run download 38822102145 -n leanglish-finding-inputs -D /tmp/finding-delivery/inputs/catalog
          gh run download 38826598594 -p 'finding-statements-*' -D /tmp/finding-delivery/inputs/statements
          gh run download 38824665068 -p 'finding-proofs-*' -D /tmp/finding-delivery/inputs/proofs
      - name: Prepare optional native MathML renderer without font files
        run: |
          mkdir -p /tmp/finding-delivery/assets
          cd /tmp
          npm pack katex@0.16.22 --silent > katex-pack-name.txt
          tar -xzf "$(cat katex-pack-name.txt)" -C /tmp/finding-delivery/assets --strip-components=2 package/dist/katex.min.js
          tar -xOf "$(cat katex-pack-name.txt)" package/LICENSE > /tmp/finding-delivery/assets/KATEX-LICENSE
          sha256sum /tmp/finding-delivery/assets/* > /tmp/finding-delivery/assets/SHA256SUMS
      - name: Preserve the exact application source
        run: |
          git archive --format=zip --prefix=Leanglish/ -o /tmp/finding-delivery/application.zip HEAD
          git rev-parse HEAD > /tmp/finding-delivery/application-commit.txt
          git rev-parse HEAD^{tree} > /tmp/finding-delivery/application-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leanglish-all-finding-observations
          path: /tmp/finding-delivery/
          retention-days: 90
