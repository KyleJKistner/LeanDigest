name: Complete documented theorem readings in original environment
on:
  workflow_dispatch:
  push:
    branches: [work/full-original-project]
    paths: ['.github/workflows/original-proof-campaign.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: original-proof-completion
  cancel-in-progress: false
env:
  GLIBC_TUNABLES: glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Retrieve audited original plan and all retained baseline proofs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/inputs
          gh run download 38822475057 -R "$GITHUB_REPOSITORY" -n complete-openai-lean-source -D /tmp/inputs/source
          gh run download 39141760623 -R "$GITHUB_REPOSITORY" -n original-project-seed -D /tmp/seed
          gh run download 39049596449 -R "$GITHUB_REPOSITORY" -n leanglish-all-finding-observations -D /tmp/inputs/observations
          gh run download 39065371645 -R "$GITHUB_REPOSITORY" -p 'finding-proof-retry-*' -D /tmp/inputs/repaired
          gh run download 39140071998 -R "$GITHUB_REPOSITORY" -n all-prior-proof-observations -D /tmp/inputs/prior
          python -c "from pathlib import Path; from scripts.assemble_finding_release import unpack_source; unpack_source(Path('/tmp/inputs'),Path('/tmp/original-project'))"
      - name: Reconcile the entire 536-target universe before starting work
        run: |
          mkdir -p /tmp/campaign
          python scripts/original_proof_campaign.py plan --project /tmp/original-project/lean --plan /tmp/seed/plan.json --environment /tmp/seed/environment.json \
            --baseline /tmp/inputs/observations/inputs/proofs --baseline /tmp/inputs/repaired --baseline /tmp/inputs/prior/remaining --baseline /tmp/inputs/prior/budget \
            --output /tmp/campaign/campaign.json --matrix /tmp/campaign/matrix.json
          cp /tmp/seed/plan.json /tmp/seed/environment.json /tmp/campaign/
          git rev-parse HEAD > /tmp/campaign/application-commit.txt
          git archive --format=zip --prefix=Leanglish/ -o /tmp/campaign/application.zip HEAD
      - id: matrix
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          campaign=json.loads(Path('/tmp/campaign/campaign.json').read_text())
          assert campaign['campaign_sha256']=='017881c8d54245523211e662ae4f68054bde6bfbff38206b96a99eb497bfdd77'
          assert campaign['expected_theorem_targets']==536 and campaign['baseline_readings']==323 and campaign['selected_theorems']==213
          matrix=json.loads(Path('/tmp/campaign/matrix.json').read_text());assert len(matrix['include'])==148
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('value='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: original-proof-campaign-plan, path: /tmp/campaign/, retention-days: 90, if-no-files-found: error}
  proofs:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: leanprover/lean-action@v1
        with: {lake-package-directory: lean, auto-config: false, build: false, test: false, lint: false, use-mathlib-cache: false, use-github-cache: false}
      - uses: actions/download-artifact@v4
        with: {name: original-proof-campaign-plan, path: /tmp/campaign}
      - name: Restore unchanged original source and its full pinned dependency cache
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/inputs/source
          gh run download 38822475057 -R "$GITHUB_REPOSITORY" -n complete-openai-lean-source -D /tmp/inputs/source
          python -c "from pathlib import Path; from scripts.assemble_finding_release import unpack_source; unpack_source(Path('/tmp/inputs'),Path('/tmp/original-project'))"
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/original-project/lean/.lake/packages
          key: original-openai-deps-1581d4cb-4341-full-v1
          fail-on-cache-miss: true
      - name: Check original environment and extract every selected theorem from this module
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          python scripts/original_proof_campaign.py run --project /tmp/original-project/lean --plan /tmp/campaign/plan.json --environment /tmp/campaign/environment.json \
            --campaign /tmp/campaign/campaign.json --module-id '${{ matrix.id }}' --output /tmp/proof-output --trust-project
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-proof-${{ matrix.id }}
          path: /tmp/proof-output/
          retention-days: 90
          if-no-files-found: warn
  summary:
    if: always()
    needs: [plan, proofs]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'original-proof-*', path: /tmp/workers}
      - name: Recover bound baseline inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/inputs
          gh run download 38822475057 -R "$GITHUB_REPOSITORY" -n complete-openai-lean-source -D /tmp/inputs/source
          gh run download 39049596449 -R "$GITHUB_REPOSITORY" -n leanglish-all-finding-observations -D /tmp/inputs/observations
          gh run download 39065371645 -R "$GITHUB_REPOSITORY" -p 'finding-proof-retry-*' -D /tmp/inputs/repaired
          gh run download 39140071998 -R "$GITHUB_REPOSITORY" -n all-prior-proof-observations -D /tmp/inputs/prior
          python -c "from pathlib import Path; from scripts.assemble_finding_release import unpack_source; unpack_source(Path('/tmp/inputs'),Path('/tmp/original-project'))"
      - name: Require every original theorem to have retained proof-reading evidence
        run: |
          python scripts/original_proof_campaign.py reconcile --project /tmp/original-project/lean \
            --plan /tmp/workers/original-proof-campaign-plan/plan.json --environment /tmp/workers/original-proof-campaign-plan/environment.json \
            --campaign /tmp/workers/original-proof-campaign-plan/campaign.json --workers /tmp/workers \
            --baseline /tmp/inputs/observations/inputs/proofs --baseline /tmp/inputs/repaired --baseline /tmp/inputs/prior/remaining --baseline /tmp/inputs/prior/budget \
            --output /tmp/campaign-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: original-proof-campaign-summary, path: /tmp/campaign-summary.json, retention-days: 90, if-no-files-found: warn}
