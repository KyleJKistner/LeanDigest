name: Reconcile breadth observations
on:
  workflow_dispatch:
  push:
    branches: [work/breadth-recovery]
    paths: ['.github/workflows/breadth-observations.yml']
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Collect prior successes and all surviving breadth shard outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/breadth/native-metadata
          gh run download 39065371645 -p 'finding-proof-retry-*' -D /tmp/breadth/repaired
          gh run download 39067324637 -p 'finding-proof-remaining-*' -D /tmp/breadth/remaining
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/39067324637/jobs?per_page=100" > /tmp/breadth/native-metadata/jobs-pages.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/39067324637/artifacts?per_page=100" > /tmp/breadth/native-metadata/artifact-pages.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39067324637" > /tmp/breadth/native-metadata/run.json
          git archive --format=zip --prefix=Leanglish/ -o /tmp/breadth/application.zip HEAD
          git rev-parse HEAD > /tmp/breadth/application-commit.txt
          git rev-parse HEAD^{tree} > /tmp/breadth/application-tree.txt
      - name: Report recorded outcomes without calling failed or missing shards successful
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,collections
          root=Path('/tmp/breadth'); reports=[]
          for p in sorted((root/'remaining').rglob('proofs.json')):
              r=json.loads(p.read_text());reports.append(r)
          shards={r['shard'] for r in reports}
          statuses=collections.Counter(x['status'] for r in reports for x in r['targets'])
          summary={'run':39067324637,'reports_retained':len(reports),'missing_report_shards':sorted(set(range(64))-shards),'statuses':dict(statuses),'recorded_targets':sum(len(r['targets']) for r in reports),'recorded_successes':sum(r['kernel_checked'] for r in reports),'new_native_execution':False}
          (root/'collection-summary.json').write_text(json.dumps(summary,indent=2)+'\n');print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leanglish-breadth-observations
          path: /tmp/breadth/
          retention-days: 90
          if-no-files-found: error
