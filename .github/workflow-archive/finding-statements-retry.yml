name: Retry two finding statements
on:
  push:
    branches: [work/finding-catalog]
    paths:
      - .github/workflows/finding-statements-retry.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: finding-statements-retry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  statements:
    strategy:
      fail-fast: false
      matrix:
        configuration: [CharacterVarietiesAllSeamsSupport, CoarseAssembly]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Recover complete hash-verified frozen Lean source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source-artifact /tmp/upstream
          gh run download 38822475057 -R "${GITHUB_REPOSITORY}" -n complete-openai-lean-source -D /tmp/source-artifact
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,tarfile
          root=Path('/tmp/source-artifact')
          p=root/'openai-lean-source.tar.gz'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          r=json.loads((root/'source-summary.json').read_text())
          assert r['commit']=='1581d4cbdd69a0faf34b2089614fe2a814316a6a' and r['all_source_bytes_match_git']
          with tarfile.open(p) as archive:archive.extractall('/tmp/upstream',filter='data')
          PY
      - name: Create a statement-only harness using the exact upstream shared pins
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          from proofreader.openai_acceptance import lake_config
          source=Path('/tmp/upstream/lean');project=Path('/tmp/finding-statements-project');project.mkdir()
          upstream=json.loads((source/'lake-manifest.json').read_text())
          shared={'mathlib','batteries','aesop','Qq','Cli','LeanSearchClient','importGraph','plausible','proofwidgets'}
          pins=[{k:p[k] for k in ('name','url','rev')} for p in upstream['packages'] if p['name'] in shared]
          assert len(pins)==9
          for folder in ('ComparatorChallenges','OAI'):shutil.copytree(source/folder,project/folder)
          shutil.copy2(source/'lean-toolchain',project/'lean-toolchain')
          shutil.copy2('lean/FindingStatements.lean',project/'FindingStatements.lean')
          text=lake_config(pins)+'\n[[lean_lib]]\nname = "ComparatorChallenges"\n\n[[lean_lib]]\nname = "FindingStatements"\n'
          (project/'lakefile.toml').write_text(text)
          (project/'selected-pins.json').write_text(json.dumps(pins,indent=2))
          PY
          cd /tmp/finding-statements-project
          lake update
          lake exe cache get
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('.')
          pins=json.loads((p/'selected-pins.json').read_text())
          actual={x['name']:x for x in json.loads((p/'lake-manifest.json').read_text())['packages']}
          assert set(actual)=={x['name'] for x in pins}
          for x in pins:
              assert actual[x['name']]['rev']==x['rev'] and actual[x['name']]['url']==x['url']
              assert subprocess.check_output(['git','-C',str(p/'.lake/packages'/x['name']),'rev-parse','HEAD'],text=True).strip()==x['rev']
          PY
      - name: Enumerate every selected comparison target and export its elaborated statement
        run: |
          python scripts/extract_finding_statements.py --project /tmp/finding-statements-project \
            --output /tmp/statements-${{ matrix.configuration }} --shard 0 --shards 1 --configuration ${{ matrix.configuration }} --workers 1 --build-timeout 1200 --trust-project
      - name: Preserve build identity and explicit non-proof status
        if: always()
        run: |
          mkdir -p /tmp/statements-${{ matrix.configuration }}
          git rev-parse HEAD > /tmp/statements-${{ matrix.configuration }}/application-commit.txt
          cp /tmp/finding-statements-project/selected-pins.json /tmp/statements-${{ matrix.configuration }}/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finding-statement-retry-${{ matrix.configuration }}
          path: /tmp/statements-${{ matrix.configuration }}/
          retention-days: 30
