[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-proofreader"
version = "0.4.0"
description = "Leanglish: deterministic, evidence-labelled mathematical reading views for Lean proofs"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
webtest = ["playwright>=1.50,<2"]
catalog = ["PyYAML>=6,<7"]

[project.scripts]
leanglish = "leanglish.cli:main"
proofreader = "proofreader.cli:main"

[tool.setuptools.package-data]
proofreader = ["web/*", "catalog_web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["proofreader*", "leanglish*"]
